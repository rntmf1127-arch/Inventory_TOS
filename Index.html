<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taste of Seoul Inventory</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;
      --blue:#1d6ff2;--blue-soft:#eef5ff;--red:#ef4444;--red-soft:#fff1f1;
    }
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    .app{display:grid;grid-template-columns:310px minmax(620px,1fr) 320px;min-height:100vh}
    .left,.right{background:#fff;padding:22px;border-color:var(--line);border-style:solid}
    .left{border-width:0 1px 0 0}.right{border-width:0 0 0 1px}
    .brand{font-size:28px;font-weight:800;margin-bottom:2px}.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
    .supplier{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;cursor:pointer;transition:.2s;background:#fff}
    .supplier:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.05)}
    .supplier.active{border:2px solid var(--blue);background:var(--blue-soft)}
    .supplier h3{margin:0 0 12px;font-size:22px}.supplier p{margin:7px 0;font-size:14px;color:#374151}
    .main{padding:22px}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .title{font-size:30px;font-weight:800}.date{color:#374151;font-size:14px}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .info{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
    .label{font-size:13px;color:var(--muted);margin-bottom:6px}.value{font-weight:700;font-size:18px}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .toolbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
    select,input[type="text"],input[type="number"]{width:100%;border:1px solid #cfd4dc;border-radius:10px;padding:10px;background:#fff}
    .cats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
    .cat{border:0;background:#eceff3;border-radius:10px;padding:9px 14px;cursor:pointer}
    .cat.active{background:var(--blue);color:#fff}
    .table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:12px 10px;border-bottom:1px solid #edf0f3;text-align:center}
    th{background:#f3f4f6;font-size:13px}
    td:first-child{text-align:left}
    .item-name{font-weight:700}.en{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .qty{width:74px!important;text-align:center}
    .order-num{display:inline-block;min-width:58px;padding:8px;border-radius:9px;font-weight:800}
    .need{background:var(--red-soft);color:var(--red)}.zero{background:#f3f4f6;color:#374151}
    .check{width:22px;height:22px}
    .right h2{margin:0 0 14px;font-size:24px}
    .order-item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf0f3}
    .order-item b{white-space:nowrap}
    .empty{color:var(--muted);font-size:14px;padding:8px 0}
    .summary{border-top:2px solid #edf0f3;margin-top:18px;padding-top:14px}
    .row{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:21px;color:var(--blue);font-weight:800}
    .btn{width:100%;border:0;border-radius:11px;padding:13px;margin-top:10px;cursor:pointer;font-weight:700}
    .primary{background:var(--blue);color:#fff}.secondary{background:#f3f4f6}.email{background:#eaf8ee}.text{background:#eef1ff}
    .order-info{margin-top:16px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.65}
    @media(max-width:1050px){.app{grid-template-columns:250px 1fr}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
    @media(max-width:760px){.app{display:block}.left,.right{border:0}.main{padding:14px}.info-grid,.tools{grid-template-columns:1fr}.supplier{padding:14px}.title{font-size:26px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="left">
    <div class="brand">Taste of Seoul</div>
    <div class="sub">인벤토리 주문관리 / Inventory & Order Management</div>
    <div id="supplierList"></div>
  </aside>

  <main class="main">
    <div class="topline">
      <div class="title" id="supplierTitle">SYSCO</div>
      <div class="date" id="todayLabel"></div>
    </div>

    <div class="info-grid">
      <div class="info">
        <div class="label">배송요일 / Delivery Days</div>
        <div class="value" id="deliveryDays"></div>
      </div>
      <div class="info">
        <div class="label">주문마감 / Order Cutoff</div>
        <div class="value" id="cutoffDays"></div>
      </div>
    </div>

    <div class="tools">
      <div class="toolbox">
        <div class="label">오늘 인벤토리 체크 직원 / Checked by</div>
        <select id="employeeSelect">
          <option value="">직원 선택 / Select employee</option>
          <option>Yeram</option>
          <option>Hyeonggoo</option>
          <option>Jin</option>
          <option>Staff 1</option>
          <option>Staff 2</option>
        </select>
      </div>
      <div class="toolbox">
        <div class="label">품목 검색 / Search Items</div>
        <input id="searchInput" type="text" placeholder="한글 또는 영어 / Korean or English" />
      </div>
    </div>

    <div class="cats" id="categoryTabs"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>품목명<br>Item</th>
            <th>기준수량<br>Target Qty</th>
            <th>현재수량<br>Current Qty</th>
            <th>주문수량<br>Order Qty</th>
            <th>주문<br>Order</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
  </main>

  <aside class="right">
    <h2>이번 주문 목록 / Current Order</h2>
    <div id="orderList"></div>

    <div class="summary">
      <div class="row"><span>총 주문 품목 수 / Total Items</span><b id="totalItems">0종</b></div>
      <div class="row"><span>총 주문 수량 / Total Qty</span><span class="total" id="totalQty">0개</span></div>
    </div>

    <button class="btn primary" onclick="previewOrder()">주문서 보기 / View Order</button>
    <button class="btn secondary" onclick="copyOrder()">주문 목록 복사 / Copy Order</button>
    <button class="btn email" onclick="sendEmail()">이메일로 보내기 / Send by Email</button>
    <button class="btn text" onclick="sendText()">문자로 보내기 / Send by Text</button>

    <div class="order-info" id="orderInfo"></div>
  </aside>
</div>

<script>
const employees = ["Yeram","Hyeonggoo","Jin","Staff 1","Staff 2"];

const suppliers = [
  {
    id:"sysco", name:"SYSCO",
    delivery:"화요일, 금요일 / Tue, Fri",
    cutoff:"월요일, 목요일 / Mon, Thu",
    bg:"#eef5ff",
    products:[
      {ko:"연어",en:"Salmon Loin",cat:"해산물 / Seafood",target:10},
      {ko:"참치",en:"Tuna Saku",cat:"해산물 / Seafood",target:8},
      {ko:"아보카도",en:"Avocado",cat:"야채/과일 / Produce",target:12},
      {ko:"로메인",en:"Romaine",cat:"야채/과일 / Produce",target:6},
      {ko:"오이",en:"Cucumber",cat:"야채/과일 / Produce",target:10},
      {ko:"마요네즈",en:"Mayonnaise",cat:"소스/조미료 / Sauce",target:4},
      {ko:"간장",en:"Soy Sauce",cat:"소스/조미료 / Sauce",target:6},
      {ko:"스리라차",en:"Sriracha",cat:"소스/조미료 / Sauce",target:4},
      {ko:"라이스페이퍼",en:"Rice Paper",cat:"건식품 / Dry Goods",target:6},
      {ko:"춘권피",en:"Spring Roll Wrapper",cat:"건식품 / Dry Goods",target:5}
    ]
  },
  {
    id:"costco", name:"COSTCO",
    delivery:"수요일 / Wed",
    cutoff:"월요일 / Mon",
    bg:"#fff0f2",
    products:[
      {ko:"아보카도",en:"Avocado",cat:"야채/과일 / Produce",target:12},
      {ko:"마요네즈",en:"Mayonnaise",cat:"소스/조미료 / Sauce",target:4}
    ]
  },
  {
    id:"gfs", name:"GORDON FOOD SERVICE",
    delivery:"목요일 / Thu",
    cutoff:"화요일 / Tue",
    bg:"#fff8e9",
    products:[
      {ko:"라이스페이퍼",en:"Rice Paper",cat:"건식품 / Dry Goods",target:8},
      {ko:"춘권피",en:"Spring Roll Wrapper",cat:"건식품 / Dry Goods",target:8}
    ]
  },
  {
    id:"asian", name:"ASIAN SUPPLIER",
    delivery:"금요일 / Fri",
    cutoff:"수요일 / Wed",
    bg:"#f2f0ff",
    products:[
      {ko:"간장",en:"Soy Sauce",cat:"소스/조미료 / Sauce",target:6},
      {ko:"스리라차",en:"Sriracha",cat:"소스/조미료 / Sauce",target:4}
    ]
  },
  {
    id:"local", name:"LOCAL STORE",
    delivery:"필요시 / As needed",
    cutoff:"-",
    bg:"#eefcf3",
    products:[
      {ko:"오이",en:"Cucumber",cat:"야채/과일 / Produce",target:10}
    ]
  }
];

let currentSupplierId = "sysco";
let activeCategory = "전체 / All";
const state = {};

function getSupplier(){return suppliers.find(s=>s.id===currentSupplierId)}
function ensureState(){
  const s=getSupplier();
  if(!state[s.id]) state[s.id]=s.products.map(()=>({current:"",checked:false}));
}
function renderSuppliers(){
  const wrap=document.getElementById("supplierList");
  wrap.innerHTML="";
  suppliers.forEach(s=>{
    const d=document.createElement("div");
    d.className="supplier"+(s.id===currentSupplierId?" active":"");
    d.style.background=s.bg;
    d.innerHTML=`<h3>${s.name}</h3>
      <p>🚚 배송요일 / Delivery Days<br><b>${s.delivery}</b></p>
      <p>📅 주문마감 / Order Cutoff<br><b>${s.cutoff}</b></p>`;
    d.onclick=()=>{currentSupplierId=s.id;activeCategory="전체 / All";ensureState();renderAll()};
    wrap.appendChild(d);
  });
}
function renderCategories(){
  const s=getSupplier();
  const cats=["전체 / All",...new Set(s.products.map(p=>p.cat))];
  const wrap=document.getElementById("categoryTabs");
  wrap.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat"+(c===activeCategory?" active":"");
    b.textContent=c;
    b.onclick=()=>{activeCategory=c;renderCategories();renderInventory()};
    wrap.appendChild(b);
  });
}
function renderInventory(){
  ensureState();
  const s=getSupplier();
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const body=document.getElementById("inventoryBody");
  body.innerHTML="";
  s.products.forEach((p,i)=>{
    const visibleCat=activeCategory==="전체 / All"||p.cat===activeCategory;
    const visibleSearch=!q||(p.ko+" "+p.en).toLowerCase().includes(q);
    if(!visibleCat||!visibleSearch)return;
    const st=state[s.id][i];
    const cur=Number(st.current||0);
    const order=st.current===""?0:Math.max(p.target-cur,0);
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><span class="item-name">${p.ko}</span><span class="en">${p.en}</span></td>
      <td>${p.target}</td>
      <td><input class="qty" type="number" min="0" value="${st.current}" data-i="${i}" /></td>
      <td><span class="order-num ${order>0?"need":"zero"}">${order}</span></td>
      <td><input class="check" type="checkbox" data-check="${i}" ${st.checked?"checked":""} /></td>`;
    body.appendChild(tr);
  });

  body.querySelectorAll("input[data-i]").forEach(inp=>{
    inp.oninput=e=>{
      const i=Number(e.target.dataset.i);
      state[s.id][i].current=e.target.value;
      const order=Math.max(s.products[i].target-Number(e.target.value||0),0);
      if(order===0) state[s.id][i].checked=false;
      renderInventory();renderOrder();
    }
  });
  body.querySelectorAll("input[data-check]").forEach(inp=>{
    inp.onchange=e=>{
      const i=Number(e.target.dataset.check);
      state[s.id][i].checked=e.target.checked;
      renderOrder();
    }
  });
}
function renderOrder(){
  ensureState();
  const s=getSupplier();
  const wrap=document.getElementById("orderList");
  wrap.innerHTML="";
  let items=0,total=0;
  s.products.forEach((p,i)=>{
    const st=state[s.id][i];
    const order=st.current===""?0:Math.max(p.target-Number(st.current||0),0);
    if(st.checked&&order>0){
      items++;total+=order;
      const d=document.createElement("div");
      d.className="order-item";
      d.innerHTML=`<span><b>${p.ko}</b><span class="en">${p.en}</span></span><b>${order}개</b>`;
      wrap.appendChild(d);
    }
  });
  if(items===0) wrap.innerHTML=`<div class="empty">주문할 품목을 체크해주세요.<br>Please select items to order.</div>`;
  document.getElementById("totalItems").textContent=`${items}종`;
  document.getElementById("totalQty").textContent=`${total}개`;
  document.getElementById("orderInfo").innerHTML=
    `<b>주문 정보 / Order Information</b><br>
     업체 / Supplier: ${s.name}<br>
     체크 직원 / Checked by: ${document.getElementById("employeeSelect").value||"-"}<br>
     배송요일 / Delivery Days: ${s.delivery}<br>
     주문마감 / Order Cutoff: ${s.cutoff}`;
}
function buildOrderText(){
  const s=getSupplier();
  const employee=document.getElementById("employeeSelect").value;
  if(!employee){alert("직원을 선택해주세요. / Please select an employee.");return null}
  const lines=[
    "Taste of Seoul 주문 / Order",
    `업체 / Supplier: ${s.name}`,
    `체크 직원 / Checked by: ${employee}`,
    `날짜 / Date: ${new Date().toLocaleDateString("en-CA")}`,
    ""
  ];
  let count=0;
  s.products.forEach((p,i)=>{
    const st=state[s.id][i];
    const order=st.current===""?0:Math.max(p.target-Number(st.current||0),0);
    if(st.checked&&order>0){lines.push(`${p.ko} / ${p.en} x ${order}`);count++}
  });
  if(count===0){alert("주문할 품목을 체크해주세요. / Please select items to order.");return null}
  return lines.join("\n");
}
function previewOrder(){const t=buildOrderText();if(t)alert(t)}
async function copyOrder(){const t=buildOrderText();if(!t)return;await navigator.clipboard.writeText(t);alert("복사되었습니다. / Copied.")}
function sendEmail(){
  const t=buildOrderText();if(!t)return;
  const s=getSupplier();
  const subject=encodeURIComponent(`Taste of Seoul - ${s.name} Order`);
  const body=encodeURIComponent(t);
  window.location.href=`mailto:?subject=${subject}&body=${body}`;
}
function sendText(){
  const t=buildOrderText();if(!t)return;
  const body=encodeURIComponent(t);
  window.location.href=`sms:?&body=${body}`;
}
function renderAll(){
  const s=getSupplier();
  document.getElementById("supplierTitle").textContent=s.name;
  document.getElementById("deliveryDays").textContent=s.delivery;
  document.getElementById("cutoffDays").textContent=s.cutoff;
  renderSuppliers();renderCategories();renderInventory();renderOrder();
}
document.getElementById("searchInput").addEventListener("input",renderInventory);
document.getElementById("employeeSelect").addEventListener("change",renderOrder);
document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
ensureState();renderAll();
</script>
</body>
</html>
